<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>shake Re:born 声のひろば</title>
<meta name="description" content="新しいshakeへの提案に、賛成・反対・保留で答える。あなたの提案も出せます。">
<meta name="theme-color" content="#FBF7EF">
<style>
:root{--bg:#FBF7EF;--ink:#173B45;--sub:#5E6E70;--line:#E6DFD2;--card:#fff;--or:#E8743B;--ag:#2E8B57;--dg:#C8463D;--ps:#9AA3A4;--soft:#F3EDE2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(251,247,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .in{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:15px;letter-spacing:.02em}.logo span{color:var(--or)}
.prog{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--or);border-radius:6px;transition:width .4s}
.pc{font-size:12px;color:var(--sub);font-weight:700;min-width:44px;text-align:right}
h1{font-size:26px;line-height:1.35;margin:26px 0 10px;font-weight:900}
.lead{color:var(--sub);font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}
.steps{display:grid;gap:10px;margin:14px 0 4px;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.steps b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center}
.tl{display:flex;gap:6px;margin:12px 0 0;font-size:12.5px;font-weight:700}
.tl div{flex:1;background:var(--soft);border-radius:10px;padding:8px 6px;text-align:center;line-height:1.35}.tl div.now{background:var(--or);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:var(--ink);color:#fff;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.or{background:var(--or)}
.note{font-size:12.5px;color:var(--sub);margin-top:10px}
.q{font-weight:800;font-size:14px;margin:16px 0 8px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1.5px solid var(--line);background:#fff;border-radius:30px;padding:9px 14px;font-size:14.5px;font-weight:700}
.ch.on{border-color:var(--ink);background:var(--ink);color:#fff}
select{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin-bottom:8px;color:var(--ink)}
/* card */
.meta{display:flex;gap:8px;align-items:center;margin:20px 0 8px;font-size:12.5px;font-weight:700;color:var(--sub)}
.tag{background:var(--ink);color:#fff;border-radius:20px;padding:3px 10px}
.tag.u{background:var(--or)}
.stmt{font-size:23px;font-weight:900;line-height:1.45;margin:4px 0 14px}
.story{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.story .h{font-size:12.5px;font-weight:800;color:var(--or);padding:14px 16px 0}
.story p{margin:4px 16px 14px;font-size:15px}
.story figure{margin:0;position:relative}.story img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--soft)}
.story figcaption{position:absolute;left:10px;bottom:10px;background:rgba(23,59,69,.82);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.votes{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(rgba(251,247,239,0),var(--bg) 22%);padding:22px 16px calc(12px + env(safe-area-inset-bottom))}
.votes .in{max-width:520px;margin:0 auto}
.vb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vb button{border:0;border-radius:16px;padding:14px 4px;font-size:17px;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.vb button:active{transform:translateY(3px);box-shadow:none}
.vb .a{background:var(--ag)}.vb .d{background:var(--dg)}.vb .p{background:var(--ps)}
.vb small{display:block;font-size:11px;font-weight:700;opacity:.9}
.sub2{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.sub2 button{background:none;border:0;color:var(--sub);font-weight:700;padding:4px 2px;text-decoration:underline}
.sub2 .wr{color:var(--or)}
/* after vote */
.res{margin:6px 0 14px}
.bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:5px;color:var(--sub)}
.bl .a{color:var(--ag)}.bl .d{color:var(--dg)}
.mine{display:inline-block;font-size:13px;font-weight:800;border-radius:20px;padding:3px 12px;color:#fff;margin-bottom:10px}
textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink);resize:vertical}
.priv{display:flex;gap:8px;align-items:flex-start;background:#EAF3EE;color:#1F5A3B;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:8px 0 12px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.cnt{text-align:right;font-size:12px;color:var(--sub)}
.sg{background:#FFF4EC;border:1px solid #F5C9AE;border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
.sg b{display:block;font-size:12px;color:var(--or)}
/* results */
.ri{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.ri .t{font-weight:800;font-size:14.5px;margin-bottom:6px}
.ri .my{font-size:11.5px;font-weight:800;border-radius:12px;padding:1px 8px;color:#fff;margin-left:6px;vertical-align:1px}
h2{font-size:18px;margin:26px 0 4px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:30px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(23,59,69,.45);display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.x{float:right;background:none;border:0;font-size:24px;line-height:1;color:var(--sub)}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
a{color:var(--ink)}
</style>
</head>
<body>
<header><div class="in"><div class="logo">shake <span>Re:born</span></div><div class="prog"><i id="pg" style="width:0"></i></div><div class="pc" id="pc"></div></div></header>
<div class="wrap" id="app"></div>
<div class="votes" id="vbar" hidden><div class="in">
  <div class="vb"><button class="a" data-v="1">賛成</button><button class="d" data-v="-1">反対</button><button class="p" data-v="0">保留<small>わからない</small></button></div>
  <div class="sub2"><button id="skip">この提案はとばす</button><button class="wr" id="wr">✏️ 自分の提案を書く</button></div>
</div></div>
<div class="toast" id="toast"></div>

/* 提案ごとの背景ストーリー（3Dモデルに届いた声、shake handsの話し合いなどから） */
window.VOICE_SEEDS=[
 ['Q10','入りやすさ','通路から中の様子が見えるほうが、入りやすい',
  '「入口にハイカウンターを置くと、関所みたいになりそう」「入口だからこそ、なるべくオープンに」という声が届いています。通路を歩く人から中の様子が見えると、はじめての人も入りやすくなる、という考え方です。'],
 ['Q01','席と家具','ハイチェアを主役にせず、いろいろな高さの席を混ぜる方針がよい',
  '今のshakeは、高いテーブルとハイチェアが中心です。「座ると足が床につかなくて落ち着かない」という声が、いくつも届いています。作業する人、話す人、くつろぐ人がいるので、高さのちがう席を混ぜる方針の提案です。'],
 ['Q08','居場所','人目を気にせず、一人や少人数でいられる場所がほしい',
  'shakeは、団体の活動だけでなく、一人で作業や勉強をしに来る人の居場所でもあります。shake handsの話し合いでも、一人や少人数でも安心していられる場所が大事だという声が出ました。'],
 ['Q18','居場所','団体が使う場所と、一人で使う場所は分けておくのがよい',
  'shake handsの話し合いでは「団体に場所をあけてと言われて、一人では使いにくくなった」という経験が語られました。団体の拠点であることと、一人で来た人の居場所であることを、エリアを分けて両立させる考え方です。'],
 ['Q07','席と家具','寝転んだり、靴を脱いでくつろげる場所（小上がりなど）がほしい',
  '靴を脱いで座れる小上がりには「目線の高さが変わって、少しちがう空間に感じられて素敵」「落語やスタジオにも使えそう」という声があります。一方で「だらしなく見える」「そもそも必要？」という声もあります。'],
 ['Q19','使い方','小上がりでは飲み食いしないほうがよい',
  '「飲み物や食べ物をこぼして汚れたら、結局だれも使わなくなるのでは」「小上がりでの飲食は制限したほうが」という声が届いています。くつろげることとのバランスを聞きたい提案です。'],
 ['Q12','本と本棚','本棚は動かさず、一か所にまとめて固定するのがよい',
  '3Dモデルで、いちばん意見が集まったのが本棚です。「本が入った棚は重くて、だれも動かさない」「大きな固定式の本棚に一か所にまとめては」という声がある一方、「一部だけ動かせるようにすれば戻しやすい」という声もあります。'],
 ['Q02','席と家具','家具は、できるだけキャスター付きで動かせるものにするのがよい',
  'イベント、ミーティング、一人作業。時間によって使い方が変わるのがshakeです。家具が動けば、そのつど組み替えられます。ただ「動かせると散らかって見える」「動かしたら戻らない」という心配の声も届いています。'],
 ['Q06','ルール','片付けや並べ方のルールは、使う人どうしで話し合って決めていきたい',
  '「ホワイトボードを出したら戻す、が守られない」「いつのまにか寝そべりスポットになる」など、片付けの悩みは多く寄せられています。決まりを上から貼るのではなく、使う人どうしで決めて、育てていく考え方です。'],
 ['Q11','広さ','イベントのときに60人くらいが座れる広さは残したい',
  'shakeでは、講演会やワークショップなど、大人数のイベントも開かれます。家具を増やすほどふだんは快適になりますが、イベントのときに広く使えるかどうかとのバランスが必要です。'],
 ['Q09','席と家具','窓の外を見ながら座れる席がほしい',
  '窓際の席は人気があります。一方で「空調が届きにくくて、とても暑い日がある」という声も届いています。景色を楽しめる席として残したいかどうかを聞く提案です。'],
 ['Q17','設備','どの席からも電源を取りやすくしてほしい',
  '「充電コードを取りやすくしてほしい」「電源タップを備え付けてほしい」「大きなACアダプターも挿せるように」という声が、いくつも届いています。'],
 ['Q13','案内','イベントや募集の情報は、入口近くの目につく場所に貼るのがよい',
  '「イベントカレンダーが、中まで入らないと見えないのはもったいない」「中央カウンターや入口から見える所に」という声が届いています。通りがかりの人にも、何をやっているかが伝わるようにする提案です。'],
 ['Q14','案内','shakeでどんな団体や人が活動しているかが分かる掲示がほしい',
  '「どんな人が活動しているかを見える化するのは、とてもいいと思う」という声がありました。shakeを拠点に活動する団体や人が見えると、話しかけたり、仲間に加わったりするきっかけになります。'],
 ['Q15','案内','学外の人も入ってよいことが分かる案内がほしい',
  'shakeは、学外の方も使える場所です。シェア本棚のオーナーやパートナーシップ団体など、学外の人もshakeに関わっています。でも、そのことはあまり知られていません。'],
 ['Q16','雰囲気','張り紙は最小限にして、自由に使える雰囲気を残すのがよい',
  '案内を増やすほど、分かりやすくはなります。でも、張り紙だらけになると「自由に使っていい」雰囲気が薄れてしまうかもしれません。案内を増やす提案とは、反対向きの考え方です。'],
 ['Q20','雰囲気','きれいに整えすぎず、少し雑然としているくらいがよい',
  'きれいすぎる場所は、かえって気軽に使いにくいこともあります。一方で「今のshakeは、いつも少し散らかって見える」という声も届いています。どこまで整えるのがいいかを聞く提案です。']
];

(function(){
const API='https://script.google.com/macros/s/AKfycbyRuORVVgsWallk8rlNljpedJeqhnmB2PLUznZvqtWrK4YqQaDNm9GBNXC6d_3GbU3q/exec';
const VKEY='shake3d-polis-voter', NKEY='shake3d-comment-name', AKEY='shake3d-comment-aff', DKEY='shake3d-comment-detail', MYV='shake3d-polis-myvotes', SKIPK='shake-voice-skip', RSK='shake-voice-reasons', PKEY='shake3d-polis-pending';
const MAXLEN=140, USER_ITEM='みんなの提案';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lget=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; }catch(_){ return d; } };
const lset=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} };
let VOTER=lget(VKEY,''); if(!VOTER){ VOTER='v'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); lset(VKEY,VOTER); }
const SEEDS=(window.VOICE_SEEDS||[]).map(([id,cat,text,story])=>({id,cat,text,story,seed:true}));
const IMG=window.VOICE_IMG||{};
const FAC={'法学部':['法学科'],'経営学部':['経営学科','国際経営学科'],'経済学部':['経済学科','産業社会学科'],'外国語学部':['国際英語学科','国際キャリア学科'],'人間学部':['人間学科'],'都市情報学部':['都市情報学科'],'情報工学部':['情報工学科'],'理工学部':['数学科','電気電子工学科','応用化学科','材料機能工学科','機械工学科','交通機械工学科','メカトロニクス工学科','社会基盤デザイン工学科','環境創造工学科','建築学科'],'農学部':['生物資源学科','応用生物化学科','生物環境科学科'],'薬学部':['薬学科'],'大学院':[]};
const dispName=s=>{ if(!s) return '匿名'; const m=String(s).match(/（([^（）]*)）\s*$/); return m?m[1]:s; };

let ALL=SEEDS.slice(), VOTES={}, loaded=false, view='intro', cur=null, JD=lget(DKEY,{})||{}, after=null;
const mine=()=>lget(MYV,{});
const aff=()=>lget(AKEY,'');

/* ---------- API ---------- */
async function list(){ for(let k=0;k<3;k++){ try{ const r=await fetch(API+'?action=list&voter='+encodeURIComponent(VOTER)+'&t='+Date.now()); return JSON.parse(await r.text()); }catch(_){ await new Promise(z=>setTimeout(z,800*(k+1))); } } throw new Error('list'); }
async function send(o){ for(let k=0;k<3;k++){ try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}); return JSON.parse(await r.text()); }catch(e){ if(k===2) throw e; await new Promise(z=>setTimeout(z,900*(k+1))); } } }
async function flush(){ const Q=lget(PKEY,{}); for(const sid of Object.keys(Q)){ try{ const r=await send({action:'vote',id:sid,voter:VOTER,vote:Q[sid]}); if(r&&r.ok){ const Q2=lget(PKEY,{}); if(Q2[sid]===Q[sid]){ delete Q2[sid]; lset(PKEY,Q2); } } }catch(_){ return; } } }
async function refresh(){ try{ await flush(); }catch(_){}
  try{ const j=await list(); const V={}; (j.votes||[]).forEach(([u,s,v])=>{ (V[s]=V[s]||{})[u]=+v; });
    const user=(j.comments||[]).filter(c=>c&&!c.hidden&&!c.parent&&c.item===USER_ITEM).map(c=>({id:c.id,cat:'みんなの提案',text:c.text,by:dispName(c.name),at:c.at,user:true}));
    ALL=SEEDS.concat(user); VOTES=V; loaded=true; }catch(e){ console.warn(e); }
  const M=mine(); Object.entries(M).forEach(([s,v])=>{ (VOTES[s]=VOTES[s]||{})[VOTER]=v; }); }
function agg(sid){ const V=VOTES[sid]||{}; let a=0,d=0,p=0; Object.values(V).forEach(v=>{ if(v>0)a++; else if(v<0)d++; else p++; }); return {a,d,p,n:a+d+p}; }
const pc=(x,n)=>n?Math.round(x/n*100):0;

/* ---------- 順番 ---------- */
function queue(){ const M=mine(), S=lget(SKIPK,[]);
  const seeds=ALL.filter(c=>c.seed&&!(c.id in M)&&!S.includes(c.id));
  const users=ALL.filter(c=>c.user&&!(c.id in M)&&!S.includes(c.id)).sort((a,b)=>agg(a.id).n-agg(b.id).n);
  // 提案がたまってきたら、みんなの提案をたたき台の間に混ぜる
  const out=[]; let ui=0; seeds.forEach((s,i)=>{ out.push(s); if(i%3===2&&ui<users.length) out.push(users[ui++]); }); while(ui<users.length) out.push(users[ui++]);
  return out; }
function progress(){ const M=mine(); const done=ALL.filter(c=>c.id in M).length; const tot=ALL.length;
  $('#pg').style.width=(tot?Math.round(done/tot*100):0)+'%'; $('#pc').textContent=view==='intro'||view==='join'?'':done+' / '+tot; }

/* ---------- 画面 ---------- */
const app=$('#app');
function show(h){ app.innerHTML='<div class="fade">'+h+'</div>'; window.scrollTo(0,0); progress(); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1800); }

function intro(){ view='intro'; $('#vbar').hidden=true;
  show(`<h1>新しいshakeに、<br>あなたの声を。</h1>
  <p class="lead">「shake」は来年で開設10年。2027年4月に新しくなります。これまでに集まった声から生まれた提案に、答えてください。</p>
  <div class="box"><ul class="steps">
   <li><b class="n">1</b><span>提案と、その<b>背景</b>を読む</span></li>
   <li><b class="n">2</b><span><b>賛成・反対・保留</b>のボタンで答える</span></li>
   <li><b class="n">3</b><span>言いたいことがあれば、<b>あなたの提案</b>を書く。ほかの人がそれに答えます</span></li></ul>
   <div class="tl"><div class="now">10〜11月<br>声を集める</div><div>12月<br>声を反映した<br>配置案をつくる</div><div>2027年4月<br>新しいshakeへ</div></div></div>
  <button class="btn or" id="go">はじめる（約3分）</button>
  <p class="note">学生・教職員のみなさんも、学外のみなさんも大歓迎です。どの提案から答えても、途中でやめても大丈夫。</p>`);
  $('#go').onclick=()=>{ aff()?next():join(); }; }

function join(){ view='join'; $('#vbar').hidden=true; const d=JD;
  const ch=(k,v,l)=>`<button class="ch${d[k]===v?' on':''}" data-k="${k}" data-v="${v}">${l}</button>`;
  const fac=(opt)=>`<select data-k="fac"><option value="">${opt?'学部を選ぶ（任意）':'学部を選ぶ'}</option>${Object.keys(FAC).map(f=>`<option${d.fac===f?' selected':''}>${f}</option>`).join('')}</select>`;
  const dep=()=>d.fac&&FAC[d.fac]&&FAC[d.fac].length>1?`<select data-k="dep"><option value="">学科を選ぶ（任意）</option>${FAC[d.fac].map(x=>`<option${d.dep===x?' selected':''}>${x}</option>`).join('')}</select>`:'';
  let h=`<h1 style="font-size:22px">あなたの所属を<br>教えてください</h1><p class="lead">お名前や学籍番号は聞きません。</p>
   <div class="q">あなたは？</div><div class="chs">${ch('type','stu','🎓 学生')}${ch('type','fac','🧑‍🏫 教員')}${ch('type','staff','🏢 職員')}${ch('type','alum','🎓 卒業生')}${ch('type','gen','🌏 学外の方')}</div>`;
  if(d.type==='stu') h+=`<div class="q">学部・学科</div>${fac()}${dep()}`;
  if(d.type==='fac') h+=`<div class="q">学部</div>${fac(1)}`;
  if(d.type==='alum') h+=`<div class="q">在学していたときの学部</div>${fac(1)}`;
  if(d.type==='gen'){ const g=d.gens||[]; const mc=(v,l)=>`<button class="ch${g.includes(v)?' on':''}" data-g="${v}">${g.includes(v)?'✓ ':''}${l}</button>`;
    h+=`<div class="q">あてはまるもの（いくつでも）</div><div class="chs">${mc('shelf','📚 シェア本棚オーナー')}${mc('partner','🤝 shakeパートナーシップ団体')}${mc('other','そのほかの方')}</div>`; }
  h+=`<div style="margin-top:22px"><button class="btn or" id="ok">次へ</button></div>
   <p class="note">🔒 賛成・反対・保留の回答は、だれが答えたかは表示されません。あなたが提案を書いたときだけ、所属（例：「都市情報学部・学生」）が表示されます（提案ごとに匿名にもできます）。</p>`;
  show(h);
  app.querySelectorAll('[data-k][data-v]').forEach(b=>b.onclick=()=>{ JD[b.dataset.k]=b.dataset.v; if(b.dataset.k==='type'){ delete JD.fac; delete JD.dep; delete JD.gens; } join(); });
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const s=new Set(JD.gens||[]); s.has(b.dataset.g)?s.delete(b.dataset.g):s.add(b.dataset.g); JD.gens=[...s]; join(); });
  app.querySelectorAll('select').forEach(s=>s.onchange=()=>{ JD[s.dataset.k]=s.value; if(s.dataset.k==='fac') delete JD.dep; join(); });
  $('#ok').onclick=()=>{ const d=JD;
    if(!d.type) return toast('「あなたは？」を選んでください');
    if(d.type==='stu'&&!d.fac) return toast('学部を選んでください');
    if(d.type==='gen'&&!(d.gens&&d.gens.length)) return toast('あてはまるものを選んでください');
    const a=affOf(d); lset(NKEY,a); lset(AKEY,a); lset(DKEY,d);
    try{ send({action:'join',voter:VOTER,name:a,aff:a,detail:JSON.stringify(d)}); }catch(_){}
    if(after){ const f=after; after=null; f(); } else next(); }; }
function affOf(d){ const fac=d.fac||'';
  if(d.type==='stu') return (fac||'名城大学')+(d.dep&&FAC[fac]&&FAC[fac].length>1?d.dep:'')+'・学生';
  if(d.type==='fac') return (fac?fac+'・':'')+'教員';
  if(d.type==='staff') return '職員';
  if(d.type==='alum') return '卒業生'+(fac?'・'+fac:'');
  const g=d.gens||[]; const L=[]; if(g.includes('shelf')) L.push('シェア本棚オーナー'); if(g.includes('partner')) L.push('shakeパートナーシップ団体'); if(g.includes('other')) L.push('学外'); return L.join('・')||'学外'; }

function next(){ const q=queue(); if(!q.length) return done(); card(q[0]); }

function card(c){ view='card'; cur=c; $('#vbar').hidden=false;
  const img=c.seed&&IMG[c.id];
  show(`<div class="meta"><span class="tag${c.user?' u':''}">${esc(c.cat)}</span><span>${c.user?esc(c.by)+' さんの提案':'これまでの声から'}</span></div>
   <div class="stmt">${esc(c.text)}</div>
   ${c.seed?`<div class="story"><div class="h">なぜ、この提案？</div><p>${esc(c.story)}</p>${img?`<figure><img src="${img}" alt="3Dモデルでの配置の一例"><figcaption>配置の一例（3Dモデル）</figcaption></figure>`:''}</div>`
     :`<div class="story"><div class="h">みんなの提案</div><p>参加した人が書いた提案です。あなたはどう思いますか？</p></div>`}
   <div style="height:150px"></div>`); }

async function vote(v){ const c=cur; if(!c) return;
  const M=mine(); M[c.id]=v; lset(MYV,M); (VOTES[c.id]=VOTES[c.id]||{})[VOTER]=v;
  const Q=lget(PKEY,{}); Q[c.id]=v; lset(PKEY,Q); flush();
  afterVote(c,v); }

function afterVote(c,v){ view='after'; $('#vbar').hidden=true; const t=agg(c.id);
  const lab=v>0?['賛成','var(--ag)']:v<0?['反対','var(--dg)']:['保留','var(--ps)'];
  const ask=v>0?'賛成の理由や、こうするともっといい、があれば':v<0?'反対の理由や、こうすればいい、があれば':'迷った理由や、気になることがあれば';
  show(`<div class="meta"><span class="tag${c.user?' u':''}">${esc(c.cat)}</span></div><div class="stmt" style="font-size:19px">${esc(c.text)}</div>
   <span class="mine" style="background:${lab[1]}">あなた：${lab[0]}</span>
   <div class="res">${barHTML(t)}</div>
   <div class="q">${ask}（任意）</div>
   <textarea id="rs" rows="3" maxlength="${MAXLEN}" placeholder="ひとこと、どうぞ"></textarea><div class="cnt"><span id="rc">0</span>/${MAXLEN}</div>
   <div class="priv">🔒 <span>この理由は、ほかの回答者には表示されません。配置案をつくるメンバーだけが読みます。</span></div>
   <div class="row2"><button class="btn ghost" id="nx">とばす</button><button class="btn or" id="sr">理由を送って次へ</button></div>
   <p class="note" style="text-align:center"><a href="#" id="chg">答えを変える</a></p>`);
  const ta=$('#rs'); ta.oninput=()=>{ $('#rc').textContent=ta.value.length; };
  $('#nx').onclick=next;
  $('#sr').onclick=()=>{ const tx=ta.value.trim(); if(!tx){ next(); return; } sendReason(c,v,tx); toast('ありがとう！理由を送りました'); next(); };
  $('#chg').onclick=e=>{ e.preventDefault(); card(c); }; }

function sendReason(c,v,tx){ const R=lget(RSK,[]); const rec={sid:c.id,vote:v,text:tx.slice(0,MAXLEN),at:new Date().toISOString()}; R.push(rec); lset(RSK,R);
  // 理由は「参加者」の記録として送る（公開の一覧には出ない）
  try{ send({action:'join',voter:VOTER+'~r~'+c.id+'~'+Date.now().toString(36),name:'【理由】'+c.id,aff:aff(),detail:JSON.stringify(Object.assign({type:'reason',voter:VOTER,statement:c.text},rec))}); }catch(_){} }

const MINN=5;   // 5人以上が答えるまで、割合は見せない（少人数で結果が偏って見えるのと、だれが答えたか推測されるのを防ぐ）
function barHTML(t){ if(t.n<MINN) return '<div class="bl" style="justify-content:flex-start">🕒 答えが'+MINN+'人以上集まると、結果が見えるようになります</div>';
  return `<div class="bar"><i style="width:${pc(t.a,t.n)}%;background:var(--ag)"></i><i style="width:${pc(t.d,t.n)}%;background:var(--dg)"></i><i style="width:${pc(t.p,t.n)}%;background:var(--ps)"></i></div>
   <div class="bl"><span class="a">賛成 ${pc(t.a,t.n)}%</span><span class="d">反対 ${pc(t.d,t.n)}%</span><span>保留 ${pc(t.p,t.n)}%</span></div>`; }

function write(){ if(!aff()){ after=write; return join(); }
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div class="in fade"><button class="x" aria-label="閉じる">×</button><h2 style="margin-top:0">あなたの提案を書く</h2>
   <p class="lead" style="font-size:14px">ほかの人が<b>賛成・反対・保留</b>で答えられるように、<b>一つのことを、一文で</b>書いてください。</p>
   <div class="sg" style="background:var(--soft);border-color:var(--line)"><b>例</b>「中央カウンターに、shakeの使い方を相談できる人がいるとよい」</div>
   <textarea id="pt" rows="3" maxlength="${MAXLEN}" placeholder="〜がほしい／〜するのがよい"></textarea><div class="cnt"><span id="pcn">0</span>/${MAXLEN}</div>
   <div id="aic"></div>
   <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 14px"><input type="checkbox" id="an" style="width:20px;height:20px"> 匿名で出す（ふつうは「${esc(aff())}」と表示されます）</label>
   <button class="btn or" id="ps">提案を出す</button>
   <p class="note">出した提案は、ほかの参加者のカードとして表示されます。お名前は表示されません。</p></div>`;
  document.body.appendChild(el); const ta=el.querySelector('#pt'); ta.focus();
  ta.oninput=()=>{ el.querySelector('#pcn').textContent=ta.value.length; };
  const close=()=>el.remove(); el.querySelector('.x').onclick=close; el.onclick=e=>{ if(e.target===el) close(); };
  let checked='';
  el.querySelector('#ps').onclick=async()=>{ const tx=ta.value.trim(); if(tx.length<6) return toast('もう少し書いてください');
    const b=el.querySelector('#ps');
    if(checked!==tx){ b.disabled=true; b.textContent='読みやすさを確認中…'; checked=tx; let r=null;
      try{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),7000); const x=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'check',text:tx,item:USER_ITEM}),signal:ctl.signal}); clearTimeout(tm); r=JSON.parse(await x.text()); }catch(_){}
      b.disabled=false; b.textContent='提案を出す';
      if(r&&r.ok===false&&r.suggest){ const box=el.querySelector('#aic'); box.innerHTML=`<div class="sg"><b>こう書くと、答えてもらいやすくなります</b>${esc(r.suggest)}<div class="row2" style="margin-top:10px"><button class="btn ghost" id="kp" style="font-size:14px;padding:10px">このままでいい</button><button class="btn" id="us" style="font-size:14px;padding:10px">この文にする</button></div></div>`;
        box.querySelector('#us').onclick=()=>{ ta.value=r.suggest; checked=r.suggest; ta.oninput(); box.innerHTML=''; };
        box.querySelector('#kp').onclick=()=>{ box.innerHTML=''; };
        return; } }
    b.disabled=true; b.textContent='送信中…';
    try{ const anon=el.querySelector('#an').checked; await send({action:'add',item:USER_ITEM,itemName:USER_ITEM,name:anon?'匿名':aff(),text:tx,voter:VOTER});
      close(); toast('提案を出しました！'); await refresh(); progress(); }
    catch(_){ b.disabled=false; b.textContent='提案を出す'; toast('送れませんでした。もう一度お試しください'); } }; }

function done(){ view='done'; $('#vbar').hidden=true; const M=mine();
  const rows=ALL.map(c=>({c,t:agg(c.id)})).filter(x=>x.t.n);
  const agree=rows.filter(x=>x.t.n>=MINN).sort((a,b)=>b.t.a/b.t.n-a.t.a/a.t.n).slice(0,3);
  const split=rows.filter(x=>x.t.n>=MINN).map(x=>({...x,s:Math.min(x.t.a,x.t.d)/x.t.n})).sort((a,b)=>b.s-a.s).filter(x=>x.s>.15).slice(0,3);
  const my=v=>v===undefined?'':`<span class="my" style="background:${v>0?'var(--ag)':v<0?'var(--dg)':'var(--ps)'}">あなた：${v>0?'賛成':v<0?'反対':'保留'}</span>`;
  const item=x=>`<div class="ri"><div class="t">${esc(x.c.text)}${my(M[x.c.id])}</div>${barHTML(x.t)}</div>`;
  show(`<h1>ありがとう！</h1><p class="lead">いまある提案に、すべて答えました。みんなの答えは、12月に<b>声を反映した配置案</b>をつくるときに使います。</p>
   <button class="btn or" id="w2" style="margin-top:16px">✏️ 自分の提案を書く</button>
   ${agree.length?`<h2>多くの人が賛成している提案</h2>${agree.map(item).join('')}`:''}
   ${split.length?`<h2>意見が分かれている提案</h2>${split.map(item).join('')}`:''}
   <h2>すべての提案</h2>${ALL.map(c=>({c,t:agg(c.id)})).map(item).join('')}
   <div style="margin:24px 0 8px;display:grid;gap:10px">${lget(SKIPK,[]).length?'<button class="btn ghost" id="rsk">とばした提案に答える</button>':''}
   <a class="btn ghost" href="./?hands">3Dモデルで、shakeの配置の一例を見る</a></div>
   <p class="note">新しい提案が出たら、またこのページで答えられます。</p>`);
  $('#w2').onclick=write; const r=$('#rsk'); if(r) r.onclick=()=>{ lset(SKIPK,[]); next(); }; }

$('#vbar').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>vote(+b.dataset.v));
$('#skip').onclick=()=>{ if(!cur) return; const S=lget(SKIPK,[]); S.push(cur.id); lset(SKIPK,S); next(); };
$('#wr').onclick=write;

intro(); refresh().then(()=>{ if(view==='intro'||view==='done') progress(); if(view==='done') done(); });
})();
</script>
</body>
</html>
