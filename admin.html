<style>
:root{--ink:#1E2A22;--sub:#56615A;--mute:#8A948C;--line:#E3E8DF;--bg:#F4F6F1;--card:#fff;--g:#2E7D32;--r:#C0392B;--p:#9AA59A;--b:#2F6FB0;--o:#C97A1E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.55}
header{background:linear-gradient(135deg,#2E6B34,#1E4A24);color:#fff;padding:18px 20px 16px}

.upd{font-size:11.5px;color:#CFE3C9}
main{max-width:1200px;margin:0 auto;padding:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:-30px}
.kpi div{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}.kpi b{display:block;font-size:26px;font-weight:900;line-height:1.1}.kpi small{color:var(--sub);font-size:12px}.kpi em{font-style:normal;font-size:11.5px;color:var(--mute);display:block;margin-top:2px}
h2{font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}h2 small{font-weight:600;color:var(--mute);font-size:12px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.box{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.box h3{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px}.box h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}

      const gp=AN.ok?AN.groups.map((g,i)=>{ const u=agg(c.id,g.members); return u.n?`<div><span>${g.name}</span>${barH(u)}<b class="num">${u.n}人</b></div>`:''; }).join(''):'';
      h+=`<tr class="det"><td colspan="5"><div class="grid"><div><b>反対・保留の理由（${R.length}件）</b>${R.length?R.map(r=>{ const x=tags(r.text); return `<div class="rb">${x.t.map(z=>`<span class="rz"><em>${esc(z)}</em></span>`).join('')}${esc(x.b)}<div class="by">${esc(r.name||'匿名')}${r.at?'・'+new Date(r.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</div></div>`; }).join(''):'<div class="empty">まだありません</div>'}</div>`+
        `<div>${cats?`<b>所属別</b><div class="cats">${cats}</div>`:''}${gp?`<b style="display:block;margin-top:8px">答え方のグループ別</b><div class="cats">${gp}</div>`:''}${!c.base&&!c.seed?`<div class="sub" style="margin-top:8px">出した人：${esc(c.name||'匿名')}</div>`:''}</div></div></td></tr>`; }
    return h; }).join('');
  const all={}; RS.forEach(r=>tags(r.text).t.forEach(x=>all[x]=(all[x]||0)+1)); const mx=Math.max(1,...Object.values(all));
  document.getElementById('tags').innerHTML=Object.keys(all).length?Object.entries(all).sort((a,b)=>b[1]-a[1]).map(([x,n])=>`<div><span>${esc(x)}</span><i style="width:${Math.round(n/mx*100)}%"></i><b>${n}</b></div>`).join(''):'<div class="empty">まだありません</div>';
  const K=RS.filter(r=>r.item===KEEP); document.getElementById('keep').innerHTML=K.length?K.map(r=>`<div class="rb">${esc(r.text)}<div class="by">${esc(r.name||'匿名')}</div></div>`).join(''):'<div class="empty">まだありません</div>';
  document.getElementById('grp').innerHTML=AN.ok?AN.groups.map(g=>{ const R=ST.filter(c=>agg(c.id,g.members).n>=2).map(c=>[c,repness(c.id,g)]).filter(([c,r])=>r.r>1.25&&r.p>.55).sort((a,b)=>b[1].s-a[1].s).slice(0,5);
    return `<div class="box"><h3>${g.name}<span class="sub">${g.members.size}人</span></h3>${R.length?R.map(([c,r])=>`<div class="mini"><span class="nm">${esc(title(c))}</span><span class="v" style="color:${r.dir>0?'var(--g)':'var(--r)'}">${r.dir>0?'賛成':'反対'}${Math.round(r.p*100)}%</span></div>`).join(''):'<div class="empty">まだ特徴ははっきりしません</div>'}</div>`; }).join(''):`<div class="box"><div class="empty">いま ${AN.P||0}人。6人以上がそれぞれ3件以上答えると、答え方の似た人のまとまりが出ます。</div></div>`;
  bind(); }
function bind(){ document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{ scope=b.dataset.sc; render(); });
  const so=document.getElementById('so'); if(so) so.onchange=()=>{ sort=so.value; render(); }; const w=document.getElementById('who'); if(w) w.onchange=()=>{ who=w.value; render(); };
  document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>{ const id=r.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
  document.querySelectorAll('[data-go]').forEach(m=>m.onclick=()=>{ const id=m.dataset.go; scope='all'; open.add(id); render(); const r=document.querySelector(`tr.row[data-id="${CSS.escape(id)}"]`); if(r) r.scrollIntoView({block:'center',behavior:'smooth'}); }); }
function dl(name,rows){ const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click(); }
document.getElementById('csv1').onclick=()=>dl('みんなの声_案ごとの結果.csv',[['種類','案','回答数','賛成','反対','保留','賛成%','反対%','保留%','理由の数']].concat(ST.map(c=>{ const t=agg(c.id); return [c.base?(c.zone?'場所':c.tag):(c.seed?'方針':'意見'),title(c),t.n,t.a,t.d,t.p,pc(t.a,t.n),pc(t.d,t.n),pc(t.p,t.n),reasonsOf(c).length]; })));
document.getElementById('csv2').onclick=()=>dl('みんなの声_理由と声.csv',[['対象','気になるところ','ひとこと','名前','日時']].concat(RS.map(r=>{ const x=tags(r.text); return [rkey(r),x.t.join('・'),x.b,r.name||'匿名',r.at||'']; })));
document.getElementById('rf').onclick=load; load(); setInterval(load,60000);
</script></body></html>
